<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searching recipes… — Chefly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --c-primary: #ff6b35;
            --c-bg: #fafafa;
            --c-text: #1f2937;
            --c-text-soft: #6b7280;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(900px 500px at 50% -20%, rgba(255, 107, 53, 0.12), transparent),
                        linear-gradient(180deg, #fff8f1 0%, var(--c-bg) 100%);
            color: var(--c-text);
            padding: 24px;
        }
        .loader-card {
            text-align: center;
            max-width: 420px;
            background: #fff;
            border-radius: 32px;
            padding: 48px 40px;
            box-shadow: 0 24px 60px rgba(17, 24, 39, 0.1);
            border: 1px solid #e5e7eb;
        }
        .loader-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.25rem;
            margin-bottom: 32px;
            color: var(--c-primary);
        }
        .loader-brand i {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ff6b35, #f59e0b);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1rem;
        }
        .spinner {
            width: 64px;
            height: 64px;
            border: 4px solid #f3f4f6;
            border-top-color: var(--c-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size: 1.35rem; margin: 0 0 8px; }
        p { margin: 0; color: var(--c-text-soft); font-size: 0.95rem; }
        .query-pill {
            display: inline-block;
            margin-top: 16px;
            padding: 8px 16px;
            background: #fff1ea;
            color: #e85a2a;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="loader-card">
        <div class="loader-brand">
            <i class="fa-solid fa-utensils"></i> Chefly
        </div>
        <div class="spinner" role="status" aria-label="Loading"></div>
        <h1>Finding your recipes…</h1>
        <p>Our AI is searching thousands of dishes for you.</p>
        {% if query %}
        <span class="query-pill"><i class="fa-solid fa-magnifying-glass"></i> {{ query }}</span>
        {% endif %}
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var form = document.createElement('form');
            form.method = 'GET';
            form.action = "{{ url_for('search') }}";
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'q';
            input.value = {{ query|tojson }};
            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        });
    </script>
</body>
</html>
